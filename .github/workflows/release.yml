name: Release

# Tag-driven, because the trap this closes is a HUMAN one: the signed and
# notarized .dmg comes from `scripts/build-release.sh`, and a plain
# `npm run build` produces a bundle that looks finished and is not — it is
# signed but unnotarized, and Gatekeeper refuses it with "Apple could not
# verify this app is free of malware". 1.3.0 was very nearly shipped that way.
#
# So the release artifact is built here rather than on somebody's laptop, and
# the notarization is VERIFIED below rather than assumed.
on:
  # The check that needs NOTHING configured, and so actually runs. Whoever
  # built the artifact and however they built it, a published release is
  # inspected here and the notarization is proven rather than trusted.
  # `published` alone is not enough. Toggling an already-published release to
  # draft and back emits no `published` at all -- that was tried, and produced
  # zero runs -- so `released` is listed too, and `workflow_dispatch` below can
  # run this against the current latest release on demand. A verification job
  # nobody can trigger is a verification job nobody trusts.
  release:
    types: [published, released]
  # Full automated build, but only where the signing secrets exist; see
  # `preflight`. Without them this is SKIPPED, not failed -- a workflow that
  # goes red on every tag teaches people to ignore it.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Secrets cannot be read in a job-level `if`, so their presence is turned
  # into an output here and gated on below.
  preflight:
    name: Can this runner sign?
    runs-on: ubuntu-latest
    outputs:
      can_sign: ${{ steps.check.outputs.can_sign }}
    steps:
      - id: check
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets absent ($missing) -- the build job is skipped." \
                 "Releases are cut locally with 'npm run release'; the published artifact is" \
                 "still verified by the verify-release job. See 'Cutting a release' in the README."
          else
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          fi

  # THE ONE THAT MATTERS. 1.3.0 was nearly published as a signed but
  # unnotarized .dmg, which Gatekeeper refuses outright. Whatever produced the
  # asset -- this workflow, or a laptop -- it is downloaded from the actual
  # release here and held to `spctl`, because "I ran the right script" is not
  # evidence and the wrong script exits 0.
  verify-release:
    name: Verify the published installer is notarized
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download the release's installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a manual run, which is what the fallback below is for.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            echo "::notice::manual run -- verifying the latest release, $tag"
          fi
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir .
          ls -la ./*.dmg

      - name: Assert a stapled notarization ticket
        run: |
          shopt -s nullglob
          dmgs=(./*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::the release has no .dmg attached"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "--- $dmg"
            # Fails outright when no ticket is stapled.
            xcrun stapler validate "$dmg"
            # `spctl` reports "Unnotarized Developer ID" for a signed-but-not-
            # notarized build, and that arm is the whole point of this job.
            verdict="$(spctl --assess --type open \
                        --context context:primary-signature -vv "$dmg" 2>&1 || true)"
            echo "$verdict"
            case "$verdict" in
              *"source=Notarized Developer ID"*) ;;
              *) echo "::error::$dmg is NOT notarized -- users will be blocked by Gatekeeper"
                 exit 1 ;;
            esac
          done

  build-signed:
    name: Build, notarize and publish
    needs: preflight
    if: needs.preflight.outputs.can_sign == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      # `gh release create` writes to the repo.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # The same checks CI runs. A tag must not ship code that would have gone
      # red on `main`.
      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Fetch Tauri sidecars
        run: ./scripts/fetch-sidecars.sh aarch64-apple-darwin

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Imports the Developer ID cert into a throwaway keychain. Without this
      # the build falls back to an ad-hoc signature and notarization rejects it.
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f certificate.p12
          security find-identity -v -p codesigning

      # The very script a human would run, so there is exactly one release path
      # and CI exercises it.
      - name: Build, notarize and staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build-release.sh

      # The assertion the whole workflow exists for. `spctl` says
      # "source=Notarized Developer ID" only when a ticket is actually stapled;
      # an unnotarized build says "Unnotarized Developer ID" and is rejected.
      # Never publish without this passing.
      - name: Verify the .dmg is notarized
        run: |
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg \
                   -maxdepth 1 -name '*.dmg' | head -1)"
          [ -n "$DMG" ] || { echo "::error::no .dmg was produced"; exit 1; }
          xcrun stapler validate "$DMG"
          if ! spctl --assess --type open \
                 --context context:primary-signature -vv "$DMG" 2>&1 \
                 | tee /dev/stderr | grep -q "source=Notarized Developer ID"; then
            echo "::error::$DMG is not notarized -- refusing to publish"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          cp "$DMG" "Remedy-Transcription-${VERSION}-arm64.dmg"
          echo "ASSET=Remedy-Transcription-${VERSION}-arm64.dmg" >> "$GITHUB_ENV"

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: ${{ env.ASSET }}

      # Only on a tag. A `workflow_dispatch` run proves the signing path and
      # stops here rather than inventing a release.
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Remedy Transcription ${TAG#v}" \
              --generate-notes
          fi
