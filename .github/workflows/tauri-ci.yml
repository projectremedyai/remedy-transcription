name: Tauri CI

on:
  push:
  pull_request:

jobs:
  build-checks:
    name: Build checks
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 22, not 20: Vite 8 requires `^20.19.0 || >=22.12.0`. Bare `20` would
      # resolve to a new enough 20.x today, but nothing pins it there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Fetch Tauri sidecars
        run: ./scripts/fetch-sidecars.sh

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # The README has always claimed "Windows 10+". Until this job existed, that
  # claim was never checked by CI nor run on a real Windows machine.
  #
  # It carried `continue-on-error: true` for as long as it had never completed a
  # run on a real Windows runner, so that a first red could not block the
  # pipeline on a job nobody had been able to try. It went green on run
  # 33296608968, and the flag came off with this commit: from here it would be
  # hiding a regression rather than protecting an unproven job.
  windows-build-checks:
    name: Build checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 22, not 20: Vite 8 requires `^20.19.0 || >=22.12.0`. Bare `20` would
      # resolve to a new enough 20.x today, but nothing pins it there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
        shell: bash

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Frontend tests
        run: npm --prefix frontend test

      # This step does fetch yt-dlp for windows-x86_64-pc-windows-msvc; it
      # deliberately does NOT fetch ffmpeg/ffprobe for Windows (see the
      # script's own note) -- those are fetched separately below.
      - name: Fetch Tauri sidecars (yt-dlp)
        run: ./scripts/fetch-sidecars.sh
        shell: bash

      # fetch-sidecars.sh does not auto-fetch ffmpeg/ffprobe for Windows -- the
      # README has always documented that as a manual step. CI cannot do a
      # manual step, and it is not optional here: tauri-build's build script
      # checks that EVERY declared `externalBin` exists for the target triple,
      # so a missing ffmpeg-x86_64-pc-windows-msvc.exe fails `cargo check`
      # itself, before a single test runs.
      - name: Fetch ffmpeg/ffprobe for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $binDir = Split-Path $ffmpegExe.FullName
          Copy-Item "$binDir\ffmpeg.exe" "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe"
          Copy-Item "$binDir\ffprobe.exe" "src-tauri\binaries\ffprobe-x86_64-pc-windows-msvc.exe"

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Cargo.toml selects a keyring backend per platform, and the Linux arm --
  # `sync-secret-service` -- was the one no machine anywhere ever compiled: CI
  # ran macOS and Windows, and `build-release.sh` ships macOS arm64 only. So the
  # Linux `#[cfg]` arm could stop compiling and nothing would say so, while
  # Cargo.toml went on claiming the platform. This job exists to make that claim
  # falsifiable.
  #
  # Deliberately NOT a third copy of the frontend checks: lint and the 204
  # frontend tests are platform-independent and already run on macOS. The
  # frontend is BUILT here only because `tauri-build` embeds `frontendDist`, so
  # `cargo check` needs it to exist. What this job is actually for is the Rust
  # compile and the Rust tests.
  linux-build-checks:
    name: Build checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 22, not 20: Vite 8 requires `^20.19.0 || >=22.12.0`. Bare `20` would
      # resolve to a new enough 20.x today, but nothing pins it there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # webkit2gtk/gtk/appindicator are Tauri v2's own Linux prerequisites.
      # libdbus-1-dev is the one this job is really here for: without it
      # keyring's `sync-secret-service` backend does not build, which is the
      # exact gap the job closes.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            build-essential \
            pkg-config \
            patchelf \
            file

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Fetch Tauri sidecars (yt-dlp)
        run: ./scripts/fetch-sidecars.sh

      # As on Windows, fetch-sidecars.sh does not fetch ffmpeg/ffprobe for this
      # triple -- and they are not optional here: tauri-build checks that EVERY
      # declared `externalBin` exists for the target triple, so a missing one
      # fails `cargo check` itself, before a single test runs. apt's ffmpeg is
      # used rather than a static download because it is the reproducible
      # option on the runner; nothing in this job executes it.
      - name: Fetch ffmpeg/ffprobe for Linux
        run: |
          sudo apt-get install -y ffmpeg
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod 755 src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod 755 src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
